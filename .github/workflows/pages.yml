name: Deploy GitHub Pages Demo

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Smoke And Deploy Demo
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Browser Test Runtime
        run: npx playwright install --with-deps chromium

      - name: Export Browserd Chrome Path
        run: |
          echo "CHROME_PATH=$(node -e 'const { chromium } = require("playwright"); console.log(chromium.executablePath())')" >> "$GITHUB_ENV"

      - name: Verify Runtime
        run: npm run smoke

      - name: Build Demo
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Demo Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy Demo
        id: deployment
        uses: actions/deploy-pages@v4
