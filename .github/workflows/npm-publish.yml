name: Publish npm package

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish dindbos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check package sources
        run: npm run check

      - name: Verify SDK package
        run: npm run smoke:sdk-pack

      - name: Build SDK
        run: npm run build:sdk

      - name: Publish to npm
        run: npm publish --access public
